name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # cortex write-back logs failures here; keep them out of the checkout
      NEXUS_DATA_ROOT: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: emerge/package-lock.json

      - name: emerge — install
        working-directory: emerge
        run: npm ci
      - name: emerge — language tests
        working-directory: emerge
        run: npm run test:lang
      - name: emerge — verify
        working-directory: emerge
        run: node verify.js
      - name: emerge — propagation tests
        working-directory: emerge
        run: node test/propagation.test.js

      - name: warp — tests
        working-directory: warp
        run: npm test

      - name: tests left the checkout clean
        if: always()
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      # The rest of emerge's npm test (kg, tier-contract, invariants, gap-field, reply-engine)
      # is not run yet: six of its tests read causal-nexus.spec and runtime.spec, which are not
      # in the repo, and gap-field expects 8 pipeline events but gets 9.
